<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Runtime regression fixture</title><link rel="icon" href="data:,"></head><body style="margin:0"><div id="host" style="width:calc(100% - 40px);margin:20px"></div><script type="module">
import { mountLab } from '../src/index.js';
import '../src/style.css';
window.mountExample = () => {
  const lab = mountLab(document.querySelector('#host'), ctx => {
    const mesh = new ctx.THREE.Mesh(new ctx.THREE.BoxGeometry(6, 3, 2), new ctx.THREE.MeshStandardMaterial());
    ctx.root.add(mesh); window.fixtureMesh = mesh;
    ctx.ui.range('Example radius', { min: 0, max: 10, value: 3, onChange: value => ctx.setStatus(`Radius ${value}`) });
    ctx.ui.button('Primary action', () => ctx.setStatus('Action complete'), { primary: true });
    ctx.setStatus('Ready'); return {};
  });
  window.lab = lab; window.renderCount = 0;
  const render = lab.ctx.renderer.render.bind(lab.ctx.renderer);
  lab.ctx.renderer.render = (...args) => { window.renderCount++; return render(...args); };
  return true;
};
</script></body></html>
